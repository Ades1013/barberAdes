    <line x1="22" y1="10" x2="22" y2="22" stroke="#000000" />
    <line x1="26" y1="10" x2="26" y2="22" stroke="#000000" />
    <line x1="30" y1="10" x2="30" y2="22" stroke="#000000" />
    <line x1="34" y1="10" x2="34" y2="22" stroke="#000000" />
    <line x1="38" y1="10" x2="38" y2="22" stroke="#000000" />
