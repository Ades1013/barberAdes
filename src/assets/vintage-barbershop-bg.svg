  <!-- Fleur-de-lis & Stars Under Gentlemen Banner -->
  <g fill="#FFFFFF" stroke="none">
    <polygon points="250,768 253,776 261,776 255,781 257,789 250,784 243,789 245,781 239,776 247,776" />
    <polygon points="190,768 192,774 198,774 193,778 195,784 190,780 185,784 187,778 182,774 188,774" />
    <polygon points="310,768 312,774 318,774 313,778 315,784 310,780 305,784 307,778 302,774 308,774" />
