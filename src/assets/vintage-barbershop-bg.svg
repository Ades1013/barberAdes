      <rect x="-23" y="125" width="10" height="20" rx="2" />
      <rect x="-11" y="125" width="10" height="20" rx="2" />
      <rect x="1" y="125" width="10" height="20" rx="2" />
      <rect x="13" y="125" width="10" height="20" rx="2" />
      <rect x="25" y="125" width="10" height="18" rx="2" />
