      <path d="M -75,122 C -50,115 -25,116 0,122" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M 75,122 C 50,115 25,116 0,122" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
