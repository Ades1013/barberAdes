      <path d="M -40,180 C -45,220 -30,265 -15,305" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
      <path d="M -20,185 C -25,230 -15,280 0,335" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <path d="M 0,185 C 0,235 0,290 0,345" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
      <path d="M 20,185 C 25,230 15,280 0,335" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <path d="M 40,180 C 45,220 30,265 15,305" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
      <path d="M -55,200 C -55,230 -40,260 -25,280" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M 55,200 C 55,230 40,260 25,280" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
