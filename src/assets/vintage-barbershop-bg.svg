    <path d="M -75,70 C -65,85 -45,95 -25,95" fill="none" stroke="#000000" stroke-width="2" />
    <path d="M 75,70 C 65,85 45,95 25,95" fill="none" stroke="#000000" stroke-width="2" />

    <!-- TEETH -->
    <g fill="#F8FAFC" stroke="#000000" stroke-width="1.8">
