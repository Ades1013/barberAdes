      <path d="M -75,-145 C -45,-165 15,-165 65,-120" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M -60,-130 C -30,-150 25,-150 75,-105" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M -40,-115 C -15,-135 35,-135 82,-90" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M -80,-110 C -55,-90 0,-100 40,-85" fill="none" stroke="#000000" stroke-width="1.8" />
