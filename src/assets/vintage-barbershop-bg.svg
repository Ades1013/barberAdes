  <path d="M 16,16 L 36,16 L 36,36 L 16,36 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M 484,16 L 464,16 L 464,36 L 484,36 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M 16,784 L 36,784 L 36,764 L 16,764 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
